services:
  # Container do banco: separado da aplicação (exigência do trabalho)
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reserva
      POSTGRES_PASSWORD: reserva
      POSTGRES_DB: reservas
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reserva -d reservas"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Container da aplicação (monolito em camadas)
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://reserva:reserva@db:5432/reservas
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
